<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">PlayZone - Jeu</title>
    <meta id="pageDescription" name="description" content="Jouer à un jeu sur PlayZone">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75' fill='%236200ea'>🎮</text></svg>">
</head>
<body>
    <div id="root">
        <!-- Header -->
        <header>
            <div class="container">
                <div class="logo">🎮 PlayZone</div>
                <nav class="nav">
                    <a href="/">← Retour à l'accueil</a>
                </nav>
            </div>
        </header>

        <!-- Game Content -->
        <div class="container">
            <div id="gameContent">
                <div class="loading"></div>
                <p>Chargement du jeu...</p>
            </div>
        </div>

        <!-- Game Details -->
        <section class="container">
            <div id="gameDetails"></div>
        </section>

        <!-- Related Games -->
        <section class="container">
            <h2>Jeux Similaires</h2>
            <div class="games-grid" id="relatedGames"></div>
        </section>

        <!-- Footer -->
        <footer>
            <div class="container">
                <div class="footer-bottom">
                    <p>&copy; 2026 PlayZone. Tous droits réservés.</p>
                </div>
            </div>
        </footer>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/game.js"></script>
</body>
</html>
